<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101426">
<link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>ドロップパズル練習</title>
<style>
:root{color-scheme:dark;--bg:#101426;--muted:#aab1cd;--line:#343c5b}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;background:radial-gradient(ellipse at 50% -20%,#343661 0,transparent 55%),var(--bg);color:#f6f4ff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overscroll-behavior-y:contain}
.wrap{width:100%;max-width:560px;margin:auto;padding:24px 16px max(36px,env(safe-area-inset-bottom))}
.top{text-align:center;margin:4px 0 20px}
.eyebrow{font-size:12px;letter-spacing:.12em;color:#bdb5ff}
.top h1{font-size:25px;margin:7px 0}
.top p{margin:0;color:var(--muted);font-size:14px}
.card{background:#1b2037df;border:1px solid #ffffff14;border-radius:20px;padding:16px;box-shadow:0 18px 60px #07091466}
.stats{display:flex;justify-content:space-between;align-items:center;margin:0 3px 13px;color:var(--muted);font-size:13px}
.stats strong{color:white;font-size:16px}
.board{width:100%;display:grid;grid-template-columns:repeat(var(--columns,6),minmax(0,1fr));gap:5px;padding:7px;border-radius:15px;background:linear-gradient(145deg,#11162a,#252b46);touch-action:none;user-select:none;overflow:hidden;position:relative}
.route-overlay{position:absolute;inset:0;width:100%;height:100%;display:none;overflow:hidden;z-index:5;pointer-events:none}
.route-overlay.visible{display:block}
.route-overlay polyline{fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;opacity:.9;filter:drop-shadow(0 2px 3px #000)}
.route-overlay circle,.route-overlay rect{fill:#4ddcff;stroke:#fff;stroke-width:2;filter:drop-shadow(0 1px 3px #000)}
.route-overlay text{fill:#171525;stroke:#4ddcff;stroke-width:2px;paint-order:stroke;font:bold 11px system-ui,sans-serif;text-anchor:middle;dominant-baseline:central}
.route-overlay text.repeated{font-size:8px}
.route-overlay .route-replay-marker {fill: #ffdb62;stroke: #fff;stroke-width: 3;filter: drop-shadow(0 0 5px #07101f);}
.route-actions {display: grid;grid-template-columns: 1fr 1fr;gap: 8px;margin-top: 10px;}
.cell{aspect-ratio:1;min-width:0;border-radius:50%;display:grid;place-items:center;position:relative;border:2px solid #ffffff35;cursor:grab;box-shadow:inset 0 4px 7px #ffffff45,inset 0 -6px 9px #0006,0 2px 4px #0006}
.cell.grabbed,.cell.clearing,.cell.falling{will-change:transform,opacity}
.cell:active{cursor:grabbing}
.cell.selected{outline:3px solid white;outline-offset:1px;z-index:1}
.cell.grabbed{transform:scale(.72);opacity:.3;filter:saturate(.65)}
.cell.roulette{outline:2px dashed #fff;outline-offset:-5px}
.roulette-hand{position:absolute;z-index:2;left:calc(50% - 1.5px);top:13%;width:3px;height:37%;border-radius:3px;background:#fff;box-shadow:0 0 5px #111,0 0 8px #fff;transform-origin:50% 100%;pointer-events:none}
.cell.roulette:after{content:'';position:absolute;z-index:2;left:calc(50% - 3px);top:calc(50% - 3px);width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 5px #111;pointer-events:none}
.orb-icon{font-size:clamp(24px,8vw,39px);line-height:1;filter:drop-shadow(0 2px 2px #0008)}
.water{background:radial-gradient(circle at 34% 27%,#a9f0ff,#42a8f3 48%,#1454b1 100%)}
.fire{background:radial-gradient(circle at 34% 27%,#fff0ae,#ff7548 48%,#b92326 100%)}
.wood{background:radial-gradient(circle at 34% 27%,#e1ffc0,#79cd58 48%,#267539 100%)}
.light{background:radial-gradient(circle at 34% 27%,#fffbd0,#ffe765 48%,#c28b13 100%)}
.dark{background:radial-gradient(circle at 34% 27%,#e1c4ff,#9560dc 48%,#42216f 100%)}
.heart{background:radial-gradient(circle at 34% 27%,#ffe2f0,#ff87c2 48%,#bd286e 100%)}
.jammer{background:radial-gradient(circle at 34% 27%,#eef1f6,#9ba4b5 48%,#525b70 100%)}
.poison{background:radial-gradient(circle at 34% 27%,#d9adff,#7b35c4 48%,#2b064e 100%)}
.mortalPoison{background:radial-gradient(circle at 34% 27%,#fff0ff,#d67cff 48%,#4b176f 100%)}
.fire .orb-icon,.water .orb-icon,.wood .orb-icon,.light .orb-icon,.dark .orb-icon{display:none}
.bomb{background:radial-gradient(circle at 34% 27%,#fff0b0,#ffae3d 48%,#c34b1d 100%)}
.clearing{animation:clear-pop 180ms ease-in forwards}
@keyframes clear-pop{to{transform:scale(.15);opacity:0}}
.falling{animation:fall-in 390ms cubic-bezier(.18,.72,.3,1) both}
@keyframes fall-in{from{transform:translateY(var(--fall-from)) scale(.9);opacity:.65}to{transform:translateY(0) scale(1);opacity:1}}
.actions{display:grid;grid-template-columns:1fr;gap:9px;margin-top:14px}
button{min-height:44px;border:0;border-radius:12px;padding:11px 10px;font:600 14px system-ui,-apple-system,"Segoe UI",sans-serif;color:white;background:#333b5d;cursor:pointer;touch-action:manipulation}
button.primary{background:linear-gradient(100deg,#8071f4,#a65fe1)}
button.active{background:linear-gradient(100deg,#ed925b,#dc4e75)}
button:active{transform:scale(.98)}
.tools{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.tools button{flex:1 1 30%;font-size:12px;padding:10px 5px}
button:disabled{opacity:.45;cursor:default}
.top-message{margin:0 0 12px;padding:10px 12px;border:1px solid #ffffff24;border-radius:10px;background:#111629;color:#e8e8f5;font-size:13px;font-weight:600;line-height:1.5}
.top-message:empty{display:none}
.top-message.error{border-color:#ff7272;background:#641f2ddd;color:#fff;font-size:14px;font-weight:700}
.top-message.success{border-color:#64dba0;background:#174d3add;color:#eafff3;font-size:14px;font-weight:700}
.status{color:#d7d5ec;font-size:13px;line-height:1.6}
.hint{margin:15px 2px 0;padding-top:13px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;line-height:1.7}
.legend{display:flex;flex-wrap:wrap;gap:8px 13px;margin:12px 2px 2px;color:var(--muted);font-size:11px}
.legend span{white-space:nowrap}.legend b{font-size:15px;vertical-align:-2px}
.roulette-settings{margin-top:14px;padding:12px;border:1px solid var(--line);border-radius:14px;background:#11162988}
.settings-title{font-weight:700;font-size:13px;margin-bottom:9px}
.type-options{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.generation-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.type-option{display:flex;align-items:center;gap:5px;min-width:0;padding:6px 7px;border-radius:9px;background:#282e48;color:#e8e8f5;font-size:12px}
.type-option input{margin:0;accent-color:#a58cff}
.type-option select{flex:1;min-width:0;padding:6px 4px;border:1px solid #485071;border-radius:7px;background:#222943;color:white;font:inherit}
.interval-row{display:flex;align-items:center;gap:8px;margin-top:11px;font-size:12px;color:var(--muted)}
.interval-row select{flex:1;min-width:0;padding:8px;border:1px solid #485071;border-radius:9px;background:#222943;color:white;font:inherit}
.size-row{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:12px;color:var(--muted)}
.size-row label{white-space:nowrap}
.size-row select{flex:1;min-width:0;padding:8px;border:1px solid #485071;border-radius:9px;background:#222943;color:white;font:inherit}

.saved-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-top:10px}
.saved-row input,.saved-row select{min-width:0;padding:8px;border:1px solid #485071;border-radius:9px;background:#222943;color:white;font:inherit}
.saved-row input::placeholder{color:#aab1cd}
.saved-name,.saved-select{grid-column:span 2}
.image-import{display:grid;gap:7px;margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#11162988;font-size:13px;font-weight:700}
.image-import input{max-width:100%;font:inherit;font-size:12px;color:var(--muted)}
.image-import small{color:var(--muted);font-size:11px;font-weight:400;line-height:1.5}.saved-row button{min-height:38px;padding:8px;font-size:12px}
.held{position:fixed;z-index:10;display:none;width:68px;height:68px;border:2px solid #ffffffaa;border-radius:50%;place-items:center;pointer-events:none;opacity:.88;transform:translate(-50%,-50%) scale(1.08);box-shadow:0 8px 24px #000a,inset 0 5px 9px #ffffff70,inset 0 -7px 10px #0007;filter:saturate(1.1)}
.held.visible{display:grid}.held .orb-icon{font-size:43px;line-height:1;filter:drop-shadow(0 3px 3px #0009)}
@media(max-width:420px){.wrap{padding:max(16px,env(safe-area-inset-top)) 10px max(28px,env(safe-area-inset-bottom))}.card{padding:12px}.board{gap:3px;padding:5px}.orb-icon{font-size:clamp(19px,7.5vw,31px);filter:none}
.cell{box-shadow:inset 0 2px 4px #ffffff35,inset 0 -3px 5px #0005}
.cell.grabbed,.cell.clearing,.cell.falling{will-change:auto}
.cell.grabbed{filter:none}
.tools button{flex-basis:29%;padding:9px 3px;font-size:11px}
.type-options{grid-template-columns:repeat(3,minmax(0,1fr))}
.type-option{font-size:11px;padding:7px 5px}}
</style>
</head>
<body>
<main class="wrap">
  <header class="top">
    <div class="eyebrow">DROP PUZZLE PRACTICE</div>
    <h1>ドロップパズル練習</h1>
  </header>
  <section class="card" aria-label="パズル盤面">
    <div id="status" class="top-message" role="status" aria-live="polite"></div>
    <div class="stats"><span>盤面 <strong id="boardSizeLabel">6 × 5</strong></span><span>手数 <strong id="moveCountLabel">0</strong></span></div>
    <div class="size-row">
      <label for="boardSize">盤面サイズ</label>
      <select id="boardSize">
        <option value="5x4">5 × 4</option>
        <option value="6x5" selected>6 × 5（通常）</option>
        <option value="7x6">7 × 6</option>
      </select>
    </div>
    <div id="board" class="board" role="grid" aria-label="ドロップ盤面"></div>
    <div class="actions">
      <button id="shuffle">盤面を作り直す</button>
      <button id="showRoute" disabled>ルート表示</button>
      <button id="replayRoute" disabled>ルート再生</button>
      <button id="noSkyfall" aria-pressed="false">落ちコンなし：OFF</button>
    </div>
    <div class="tools">
      <button data-add="fire">🔴 火</button>
      <button data-add="water">🔵 水</button>
      <button data-add="wood">🟢 木</button>
      <button data-add="light">🟡 光</button>
      <button data-add="dark">🟣 闇</button>
      <button data-add="heart">💗 回復</button>
      <button data-add="jammer">⚫ お邪魔</button>
      <button data-add="poison">💀 毒</button>
      <button data-add="mortalPoison">☠️ 猛毒</button>
      <button data-add="bomb">💣 爆弾</button>
      <button id="undo" disabled>↶ 1つ戻す</button>
      <button id="addRoulette">＋ ルーレット</button>
    </div>
    <div class="saved-row" aria-label="保存した盤面">
      <input id="savedBoardName" class="saved-name" type="text" maxlength="30" placeholder="保存する盤面の名前" aria-label="保存する盤面の名前">
      <select id="savedBoards" class="saved-select" aria-label="保存した盤面を選択"><option value="">保存した盤面</option></select>
      <button id="saveBoard">保存</button>
      <button id="loadBoard">呼び出す</button>
      <button id="deleteBoard">削除</button>
    </div>
    <div class="image-import">
      <label for="boardImageInput">画像から盤面を読み込む</label>
      <input id="boardImageInput" type="file" accept="image/*">
      <small>盤面だけを切り抜いた画像を選んでください。アップロード画像全体からドロップの並びを読み取り、5×4・6×5・7×6を自動判定します。</small>
    </div>    <section class="roulette-settings" aria-label="ドロップ生成数設定">
      <div class="settings-title">盤面を作り直すときの生成数</div>
      <div class="status" style="min-height:0;margin:0 0 9px">1回目の生成後、残りのマスに2回目のドロップを生成します。各回とも「ランダム」または0〜最大値を設定できます。</div>
      <div class="settings-title">1回目の生成指定</div>
      <div id="generationOptions1" class="generation-options"></div>
      <div class="settings-title" style="margin-top:12px">2回目の生成指定</div>
      <div id="generationOptions2" class="generation-options"></div>
    </section>
    <section class="roulette-settings" aria-label="ルーレット設定">
      <div class="settings-title">ルーレットで変化するドロップ</div>
      <div id="typeOptions" class="type-options"></div>
      <label class="interval-row" for="interval">
        <span>変化間隔</span>
        <select id="interval">
          <option value="2000">低速（2秒おき）</option>
          <option value="1000" selected>通常（デフォルト・1秒おき）</option>
          <option value="500">高速（0.5秒おき）</option>
        </select>
      </label>
    </section>
  </section>
</main>
<div id="held" class="held" aria-hidden="true"><span class="orb-icon"></span></div>
<script>
(() => {
  let W = 6, H = 5, N = W * H;
  const order = ['fire','water','wood','light','dark','heart','jammer','poison','mortalPoison','bomb'];
  const icon = {fire:'🔴',water:'🔵',wood:'🟢',light:'🟡',dark:'🟣',heart:'💗',jammer:'⚫',poison:'💀',mortalPoison:'☠️',bomb:'💣'};
  const label = {fire:'火',water:'水',wood:'木',light:'光',dark:'闇',heart:'回復',jammer:'お邪魔',poison:'毒',mortalPoison:'猛毒',bomb:'爆弾'};
  const defaultTypes = ['fire','water','wood','light','dark','heart'];
  let enabledTypes = new Set(defaultTypes);
  let cells = [], roulette = [], cellElements = [], selected = -1, placing = null;
  let history = [];
  let drag = -1, dragged = false, placingRoulette = false, resolving = false, generatingBoard = false, rouletteTimer = null, rouletteStartedAt = 0;
  let moveCount = 0;
  let currentRoute = [], lastRoute = [], routeOverlay = null;
  let routeReplayFrame = 0;
  let isRouteReplaying = false;
  let noSkyfall = false;
  let rouletteAnimations = [];
  const generationCounts = [
    Object.fromEntries(order.map(type => [type, ['fire','water','wood','light','dark','heart'].includes(type) ? 'random' : 0])),
    Object.fromEntries(order.map(type => [type, 0]))
  ];
  let drawFrame = 0;
  const board = document.querySelector('#board');
  const status = document.querySelector('#status');
  const held = document.querySelector('#held');
  const heldIcon = held.querySelector('.orb-icon');
  const intervalSelect = document.querySelector('#interval');
  const rouletteButton = document.querySelector('#addRoulette');
  const typeOptions = document.querySelector('#typeOptions');
  const replayRouteButton = document.querySelector('#replayRoute');
  const generationOptions = [
    document.querySelector('#generationOptions1'),
    document.querySelector('#generationOptions2')
  ];
  const boardSizeSelect = document.querySelector('#boardSize');
  const boardSizeLabel = document.querySelector('#boardSizeLabel');
  const undoButton = document.querySelector('#undo');
  const moveCountLabel = document.querySelector('#moveCountLabel');
  const showRouteButton = document.querySelector('#showRoute');
  const savedBoardSelect = document.querySelector('#savedBoards');
  const savedBoardName = document.querySelector('#savedBoardName');
  const savedBoardsKey = 'dropPuzzleSavedBoardsV1';
  const boardImageInput = document.querySelector('#boardImageInput');

  function updateBoardLayout() {
    board.style.setProperty('--columns', String(W));
    board.style.gridTemplateColumns = `repeat(${W}, minmax(0, 1fr))`;
    boardSizeLabel.textContent = `${W} × ${H}`;
    boardSizeSelect.value = `${W}x${H}`;
  }

  function readSavedBoards() {
    try {
      const saved = JSON.parse(localStorage.getItem(savedBoardsKey) || '[]');
      return Array.isArray(saved) ? saved.filter(item => item && typeof item.name === 'string') : [];
    } catch {
      return [];
    }
  }

  function refreshSavedBoards(selectedId = '') {
    const saved = readSavedBoards();
    savedBoardSelect.replaceChildren(new Option('デフォルト', ''));
    saved.forEach(item => {
      savedBoardSelect.add(new Option(item.name, item.id));
    });
    if (selectedId && saved.some(item => item.id === selectedId)) savedBoardSelect.value = selectedId;
  }

  function saveCurrentBoard() {
    if (resolving || generatingBoard) return;
    const cleanName = savedBoardName.value.trim();
    if (!cleanName) {
      say('保存する盤面の名前を入力してください。', 'error');
      savedBoardName.focus();
      return;
    }
    const saved = readSavedBoards();
    const existing = saved.find(item => item.name === cleanName);
    const item = {
      id: existing ? existing.id : (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())),
      name: cleanName,
      width: W,
      height: H,
      cells: cells.slice(),
      roulette: roulette.slice(),
      generationCounts: generationCounts.map(settings => ({...settings})),
      savedAt: Date.now()
    };
    const next = existing ? saved.map(entry => entry.id === item.id ? item : entry) : [...saved, item];
    try {
      localStorage.setItem(savedBoardsKey, JSON.stringify(next));
      refreshSavedBoards(item.id);
      say('「' + cleanName + '」を保存しました。');
    } catch {
      say('盤面を保存できませんでした。ブラウザの保存領域を確認してください。', 'error');
    }
  }

  function loadSavedBoard() {
    if (resolving || generatingBoard) return;
    const item = readSavedBoards().find(entry => entry.id === savedBoardSelect.value);
    if (!item || ![5, 6, 7].includes(item.width) || ![4, 5, 6].includes(item.height) ||
        item.cells?.length !== item.width * item.height || item.roulette?.length !== item.cells.length) {
      say('呼び出す盤面を選んでください。', 'error');
      return;
    }
    saveUndo();
    stopRouletteTimer();
    clearRouteHistory();
    W = item.width;
    H = item.height;
    N = W * H;
    restoreGenerationCounts(item.generationCounts);
    cells = item.cells.map(type => order.includes(type) ? type : null);
    roulette = item.roulette.map((active, index) => Boolean(active && cells[index]));
    moveCount = 0;
    moveCountLabel.textContent = moveCount;
    boardSizeSelect.value = W + 'x' + H;
    updateBoardLayout();
    buildGenerationOptions();
    selected = -1;
    drag = -1;
    placing = null;
    placingRoulette = false;
    rouletteButton.classList.remove('active');
    held.classList.remove('visible');
    draw();
    rouletteStartedAt = 0;
    startRouletteTimer(true);
    say('「' + item.name + '」を呼び出しました。');
    savedBoardName.value = item.name;
  }

  function deleteSavedBoard() {
    const id = savedBoardSelect.value;
    if (!id) {
      say('削除する盤面を選んでください。', 'error');
      return;
    }
    const saved = readSavedBoards();
    const item = saved.find(entry => entry.id === id);
    try {
      localStorage.setItem(savedBoardsKey, JSON.stringify(saved.filter(entry => entry.id !== id)));
      refreshSavedBoards();
      say('「' + (item?.name || '盤面') + '」を削除しました。');
    } catch {
      say('保存した盤面を削除できませんでした。', 'error');
    }
  }

  function restoreGenerationCounts(savedCounts) {
    const defaults = [
      Object.fromEntries(order.map(type => [type, ['fire','water','wood','light','dark','heart'].includes(type) ? 'random' : 0])),
      Object.fromEntries(order.map(type => [type, 0]))
    ];

    generationCounts.forEach((settings, passIndex) => {
      order.forEach(type => {
        const value = savedCounts?.[passIndex]?.[type];
        settings[type] = value === 'random'
          ? 'random'
          : Number.isInteger(value) && value >= 0 && value <= N
            ? value
            : defaults[passIndex][type];
      });
    });
  }
  function saveUndo() {
    if (!cells.length) return;
    history.push({cells:cells.slice(), roulette:roulette.slice(), W, H, moveCount});
    if (history.length > 30) history.shift();
    undoButton.disabled = false;
  }

  function undo() {
    if (resolving || history.length === 0) return;
    const previous = history.pop();
    cells = previous.cells;
    roulette = previous.roulette;
    W = previous.W;
    H = previous.H;
    N = W * H;
    moveCount = previous.moveCount || 0;
    moveCountLabel.textContent = moveCount;
    buildGenerationOptions();
    boardSizeSelect.value = W + 'x' + H;
    updateBoardLayout();
    selected = -1;
    drag = -1;
    held.classList.remove('visible');
    undoButton.disabled = history.length === 0;
    draw();
    startRouletteTimer();
    say('直前の盤面に戻しました。');
  }

  function say(text, kind = '') {
    status.textContent = text;
    status.className = 'top-message' + (kind ? ' ' + kind : '');
    status.setAttribute('role', kind === 'error' ? 'alert' : 'status');
    status.setAttribute('aria-live', kind === 'error' ? 'assertive' : 'polite');
  }

  function clearRouteHistory() {
    stopRouteReplay();
    currentRoute = [];
    lastRoute = [];
    showRouteButton.disabled = true;
    replayRouteButton.disabled = true;
    showRouteButton.classList.remove('active');
    showRouteButton.textContent = 'ルート表示';
    routeOverlay?.classList.remove('visible');
  }

  function renderRoute() {
    if (isRouteReplaying) return;
    if (!routeOverlay?.classList.contains('visible') || lastRoute.length < 2) return;
    const boardRect = board.getBoundingClientRect();
    routeOverlay.setAttribute('viewBox', `0 0 ${boardRect.width} ${boardRect.height}`);
    routeOverlay.replaceChildren();
    const points = lastRoute.map(index => {
      const rect = cellElements[index].getBoundingClientRect();
      return {x:rect.left - boardRect.left + rect.width / 2,y:rect.top - boardRect.top + rect.height / 2};
    });
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
    line.setAttribute('points', points.map(point => `${point.x},${point.y}`).join(' '));
    routeOverlay.append(line);

    const visitsByCell = new Map();
    lastRoute.forEach((cellIndex, step) => {
      if (!visitsByCell.has(cellIndex)) visitsByCell.set(cellIndex, []);
      visitsByCell.get(cellIndex).push(step);
    });

    visitsByCell.forEach((steps, cellIndex) => {
      const point = points[lastRoute.indexOf(cellIndex)];
      const number = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      number.setAttribute('x', point.x);
      number.setAttribute('y', point.y);

      if (steps.length === 1) {
        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('cx', point.x);
        circle.setAttribute('cy', point.y);
        circle.setAttribute('r', '9');
        routeOverlay.append(circle);
        number.textContent = String(steps[0]);
      } else {
        const labelText = steps.join('·');
        const fontSize = Math.max(5, Math.min(8, 32 / labelText.length));
        const width = Math.max(18, labelText.length * fontSize * 0.62 + 6);
        const badge = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        badge.setAttribute('x', point.x - width / 2);
        badge.setAttribute('y', point.y - 7);
        badge.setAttribute('width', width);
        badge.setAttribute('height', '14');
        badge.setAttribute('rx', '7');
        routeOverlay.append(badge);
        number.setAttribute('class', 'repeated');
        number.style.fontSize = fontSize + 'px';
        number.textContent = labelText;
      }
      routeOverlay.append(number);
    });
  }

  function stopRouteReplay() {
    if (routeReplayFrame) cancelAnimationFrame(routeReplayFrame);
    routeReplayFrame = 0;
    isRouteReplaying = false;
    routeOverlay?.querySelector('.route-replay-marker')?.remove();
    replayRouteButton.classList.remove('active');
    replayRouteButton.textContent = 'ルート再生';
  }

  function replayRoute() {
    if (isRouteReplaying) {
      stopRouteReplay();
      return;
    }
    if (lastRoute.length < 2) return;
    routeOverlay.classList.add('visible');
    showRouteButton.classList.add('active');
    showRouteButton.textContent = 'ルートを隠す';
    renderRoute();

    const boardRect = board.getBoundingClientRect();
    const points = lastRoute.map(index => {
      const rect = cellElements[index].getBoundingClientRect();
      return {x:rect.left-boardRect.left+rect.width/2,y:rect.top-boardRect.top+rect.height/2};
    });
    if (points.length < 2) return;

    const marker = document.createElementNS('http://www.w3.org/2000/svg','circle');
    marker.setAttribute('class','route-replay-marker');
    marker.setAttribute('r','8');
    marker.setAttribute('cx',points[0].x);
    marker.setAttribute('cy',points[0].y);
    routeOverlay.append(marker);
    isRouteReplaying = true;
    replayRouteButton.classList.add('active');
    replayRouteButton.textContent = '再生を停止';

    const segmentDuration = 220;
    const totalDuration = segmentDuration*(points.length-1);
    let startedAt = 0;
    function animateRoute(now) {
      if (!isRouteReplaying) return;
      if (!startedAt) startedAt = now;
      const elapsed = Math.min(now-startedAt,totalDuration);
      const segment = Math.min(points.length-2,Math.floor(elapsed/segmentDuration));
      const progress = Math.min(1,(elapsed-segment*segmentDuration)/segmentDuration);
      const from = points[segment], to = points[segment+1];
      marker.setAttribute('cx',from.x+(to.x-from.x)*progress);
      marker.setAttribute('cy',from.y+(to.y-from.y)*progress);
      if (elapsed >= totalDuration) stopRouteReplay();
      else routeReplayFrame = requestAnimationFrame(animateRoute);
    }
    routeReplayFrame = requestAnimationFrame(animateRoute);
  }

  function wait(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }
  function randInitial() { return order[Math.floor(Math.random() * 6)]; }

  function shuffleArray(items) {
    for (let i = items.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [items[i], items[j]] = [items[j], items[i]];
    }
    return items;
  }

  function getGenerationPlan() {
    const counts = generationCounts.map(settings => Object.fromEntries(
      order.map(type => [type, settings[type] === 'random' ? 3 : Number(settings[type])])
    ));
    const randomSlots = [];
    generationCounts.forEach((settings, passIndex) => {
      order.forEach(type => {
        if (settings[type] === 'random') randomSlots.push({passIndex, type});
      });
    });

    let used = counts.reduce((sum, pass) => sum + Object.values(pass).reduce((a, b) => a + b, 0), 0);
    while (used < N && randomSlots.length) {
      const slot = randomSlots[Math.floor(Math.random() * randomSlots.length)];
      counts[slot.passIndex][slot.type]++;
      used++;
    }

    if (used < N) {
      const selectedTypes = order.filter(type => generationCounts.some(pass => pass[type] !== 0));
      const fillers = selectedTypes.length ? selectedTypes : order.slice(0, 6);
      const hasSecondPassSettings = order.some(type => {
        const setting = generationCounts[1][type];
        return setting === 'random' || Number(setting) > 0;
      });
      const fillPass = hasSecondPassSettings ? 1 : 0;
      while (used < N) {
        const type = fillers[Math.floor(Math.random() * fillers.length)];
        counts[fillPass][type]++;
        used++;
      }
    }

    let excess = counts.reduce((sum, pass) => sum + Object.values(pass).reduce((a, b) => a + b, 0), 0) - N;
    for (let passIndex = 1; passIndex >= 0 && excess > 0; passIndex--) {
      for (const type of [...order].reverse()) {
        const minimum = generationCounts[passIndex][type] === 'random' ? 3 : 0;
        const reduction = Math.min(excess, Math.max(0, counts[passIndex][type] - minimum));
        counts[passIndex][type] -= reduction;
        excess -= reduction;
        if (!excess) break;
      }
    }

    for (let passIndex = 1; passIndex >= 0 && excess > 0; passIndex--) {
      for (const type of [...order].reverse()) {
        if (generationCounts[passIndex][type] !== 'random') continue;
        const reduction = Math.min(excess, counts[passIndex][type]);
        counts[passIndex][type] -= reduction;
        excess -= reduction;
        if (!excess) break;
      }
    }
    return counts;
  }

  function makePassItems(passIndex, plan) {
    const items = [];
    order.forEach(type => {
      for (let i = 0; i < plan[passIndex][type]; i++) items.push(type);
    });
    return shuffleArray(items);
  }

  function getGenerationError() {
    const fullWidthBoardCounts = {20:'20',30:'30',42:'42'};
    for (let passIndex = 0; passIndex < generationCounts.length; passIndex++) {
      const settings = generationCounts[passIndex];
      const hasRandom = order.some(type => settings[type] === 'random');
      if (hasRandom) continue;
      const total = order.reduce((sum, type) => sum + Number(settings[type]), 0);
      if (total > N) {
        return (passIndex + 1) + '回目の生成する個数の合計が' + fullWidthBoardCounts[N] + 'を超えています';
      }
    }
    return '';
  }

  function placePass(items) {
    const emptyCells = shuffleArray(cells
      .map((type, index) => type === null ? index : -1)
      .filter(index => index >= 0));
    items.slice(0, emptyCells.length).forEach((type, index) => {
      cells[emptyCells[index]] = type;
    });
  }

  async function remakeConfiguredBoard() {
    if (resolving || generatingBoard) return;
    generatingBoard = true;
    say('');
    document.querySelector('#shuffle').disabled = true;
    boardSizeSelect.disabled = true;

    try {
      stopRouletteTimer();
      clearRouteHistory();
      rouletteStartedAt = 0;
      const plan = getGenerationPlan();
      cells = Array(N).fill(null);
      roulette = Array(N).fill(false);
      moveCount = 0;
      moveCountLabel.textContent = moveCount;
      selected = -1;
      placing = null;
      placingRoulette = false;
      rouletteButton.classList.remove('active');
      updateBoardLayout();

      placePass(makePassItems(0, plan));
      draw();

      const hasSecondPass = order.some(type => {
        const setting = generationCounts[1][type];
        return setting === 'random' || Number(setting) > 0;
      });
      if (hasSecondPass) {
        say('1回目のドロップを生成しました。1秒後に2回目を生成します。');
        await wait(1000);
        placePass(makePassItems(1, plan));
        draw();
      }
      say('盤面の生成が完了しました。ドロップを動かしてパズルできます。');
    } finally {
      generatingBoard = false;
      document.querySelector('#shuffle').disabled = false;
      boardSizeSelect.disabled = false;
    }
  }

  function refillRandomEmptyCells(falls) {
    cells.forEach((type, index) => {
      if (type === null) {
        cells[index] = randInitial();
        falls[index] = Math.floor(index / W) + 1;
      }
    });
  }

  function buildGenerationOptions() {
    generationOptions.forEach((container, passIndex) => {
      container.innerHTML = '';
      order.forEach(type => {
        let value = generationCounts[passIndex][type];
        if (value !== 'random' && Number(value) > N) {
          value = N;
          generationCounts[passIndex][type] = N;
        }
        const option = document.createElement('label');
        option.className = 'type-option generation-option';
        const name = document.createElement('span');
        name.textContent = icon[type] + ' ' + label[type];
        const select = document.createElement('select');
        select.setAttribute('aria-label', (passIndex + 1) + '回目の' + label[type] + '生成数');
        select.add(new Option('ランダム', 'random'));
        for (let count = 0; count <= N; count++) select.add(new Option(String(count), String(count)));
        select.value = String(value);
        select.addEventListener('change', () => {
          generationCounts[passIndex][type] = select.value === 'random' ? 'random' : Number(select.value);
        });
        option.append(name, select);
        container.append(option);
      });
    });
  }

    if (drawFrame) return;
    drawFrame = requestAnimationFrame(() => {
      drawFrame = 0;
      draw();
    });
  }

  let specialReferencePromise = null;

  function loadSpecialReferences() {
    if (specialReferencePromise) return specialReferencePromise;
    const referenceEntries = [...Object.entries(specialReferenceData), ...additionalSpecialReferenceData];
    specialReferencePromise = Promise.all(referenceEntries.map(([type, source]) =>
      new Promise(resolve => {
        const image = new Image();
        image.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = canvas.height = 24;
          const context = canvas.getContext('2d', {willReadFrequently:true});
          context.drawImage(image, 0, 0, 24, 24);
          try { resolve({type, pixels:context.getImageData(0, 0, 24, 24).data}); }
          catch { resolve(null); }
        };
        image.onerror = () => resolve(null);
        image.src = source;
      })
    )).then(items => items.filter(Boolean));
    return specialReferencePromise;
  }

  function classifyOrbColor(colorSamples) {
    let neutralSamples = 0;
    const palette = [
      ['fire', 8], ['bomb', 27], ['water', 210], ['wood', 112],
      ['light', 52], ['dark', 274], ['heart', 333]
    ];
    const votes = Object.fromEntries(palette.map(([type]) => [type, 0]));

    function typeForHue(hue) {
      if (hue >= 345 || hue < 18) return 'fire';
      if (hue >= 18 && hue < 35) return 'bomb';
      if (hue >= 185 && hue < 245) return 'water';
      if (hue >= 75 && hue < 165) return 'wood';
      if (hue >= 35 && hue < 75) return 'light';
      if (hue >= 245 && hue < 315) return 'dark';
      if (hue >= 315 && hue < 345) return 'heart';
      return null;
    }

    for (const [r, g, b] of colorSamples) {
      const red = r / 255, green = g / 255, blue = b / 255;
      const max = Math.max(red, green, blue), min = Math.min(red, green, blue);
      const delta = max - min;
      const saturation = max === 0 ? 0 : delta / max;
      if (saturation < 0.2 || max < 0.12) { neutralSamples++; continue; }

      let hue = 0;
      if (delta > 0) {
        if (max === red) hue = 60 * (((green - blue) / delta) % 6);
        else if (max === green) hue = 60 * ((blue - red) / delta + 2);
        else hue = 60 * ((red - green) / delta + 4);
      }
      if (hue < 0) hue += 360;

      let type = typeForHue(hue);
      if (!type) {
        let nearestDistance = Infinity;
        for (const [candidate, targetHue] of palette) {
          const difference = Math.abs(hue - targetHue);
          const distance = Math.min(difference, 360 - difference);
          if (distance < nearestDistance) { type = candidate; nearestDistance = distance; }
        }
        if (nearestDistance > 36) continue;
      }
      // 強く色づいた中心色を重く数え、光の反射や暗い縁の影響を抑える。
      votes[type] += saturation * Math.sqrt(max);
    }

    const winner = Object.entries(votes).sort((a, b) => b[1] - a[1])[0];
    if (neutralSamples / colorSamples.length >= 0.8) return 'jammer';
    return winner && winner[1] > 0 ? winner[0] : 'fire';
  }
  function hasMortalPoisonColorSignature(tilePixels) {
    let blackPixels = 0, lightPurplePixels = 0, whitePixels = 0, total = 0;
    for (let y = 3; y < 21; y++) {
      for (let x = 3; x < 21; x++) {
        const i = (y * 24 + x) * 4;
        const r = tilePixels[i], g = tilePixels[i + 1], b = tilePixels[i + 2];
        const max = Math.max(r, g, b), min = Math.min(r, g, b);
        const saturation = max === 0 ? 0 : (max - min) / max;
        let hue = 0;
        if (max !== min) {
          if (max === r) hue = 60 * (((g - b) / (max - min)) % 6);
          else if (max === g) hue = 60 * ((b - r) / (max - min) + 2);
          else hue = 60 * ((r - g) / (max - min) + 4);
          if (hue < 0) hue += 360;
        }
        if (max < 70) blackPixels++;
        if (hue >= 250 && hue <= 320 && saturation >= 0.18 && max >= 122) lightPurplePixels++;
        total++;
      }
    }
    // 闇ドロップは薄紫色を含むので、黒と薄紫の両方が十分ある場合に猛毒とする。
    return blackPixels / total >= 0.08 && lightPurplePixels / total >= 0.16 && whitePixels / total < 0.22;
  }
  function hasPoisonColorSignature(tilePixels) {
    let deepPurplePixels = 0, whitePixels = 0, total = 0;
    for (let y = 3; y < 21; y++) {
      for (let x = 3; x < 21; x++) {
        const i = (y * 24 + x) * 4;
        const r = tilePixels[i], g = tilePixels[i + 1], b = tilePixels[i + 2];
        const max = Math.max(r, g, b), min = Math.min(r, g, b);
        const saturation = max === 0 ? 0 : (max - min) / max;
        let hue = 0;
        if (max !== min) {
          if (max === r) hue = 60 * (((g - b) / (max - min)) % 6);
          else if (max === g) hue = 60 * ((b - r) / (max - min) + 2);
          else hue = 60 * ((r - g) / (max - min) + 4);
          if (hue < 0) hue += 360;
        }
        const matchesPoisonPurple = Math.abs(r - 123) <= 38 && Math.abs(g - 53) <= 38 && Math.abs(b - 196) <= 38;
        if ((hue >= 250 && hue <= 320 && saturation >= 0.4 && max < 145) || matchesPoisonPurple) deepPurplePixels++;
        if (max > 185 && saturation < 0.2) whitePixels++;
        total++;
      }
    }
    // 濃い紫と白いドクロ部分の組み合わせで毒を判定する。
    return deepPurplePixels / total >= 0.12 && whitePixels / total >= 0.22;
  }
  function findSpecialTemplate(tilePixels, references) {

    for (const scale of [0.9, 1, 1.1]) {

    const bestByType = new Map();
    for (const reference of references) {
      let bestError = Infinity;

        for (let y = 3; y < 21; y++) {
          for (let x = 3; x < 21; x++) {
            const sourceX = Math.max(0, Math.min(23, Math.round(12 + (x - 12) * scale + shiftX)));
            const sourceY = Math.max(0, Math.min(23, Math.round(12 + (y - 12) * scale + shiftY)));
            const ti = (sourceY * 24 + sourceX) * 4;
            const ri = (y * 24 + x) * 4;
            error += Math.abs(tilePixels[ti] - reference.pixels[ri]);
            error += Math.abs(tilePixels[ti+1] - reference.pixels[ri+1]);
            error += Math.abs(tilePixels[ti+2] - reference.pixels[ri+2]);
            samples += 3;
          }
        }
        bestError = Math.min(bestError, error / samples);
      }
      const previous = bestByType.get(reference.type);
      if (!previous || bestError < previous.error) bestByType.set(reference.type, {type:reference.type, error:bestError});
    }
    const scores = [...bestByType.values()].sort((a,b) => a.error - b.error);
    // 小さな位置ずれや拡大縮小は許容しつつ、通常ドロップを誤判定しない閾値にする。
    // 似た色の通常ドロップを特殊ドロップと誤認しないよう一致条件を厳しくする。
    const toxinType = scores[0] && (scores[0].type === 'poison' || scores[0].type === 'mortalPoison');
    const toxinPair = toxinType && scores[1] && (scores[1].type === 'poison' || scores[1].type === 'mortalPoison');
    const requiredMargin = toxinPair ? 3 : 8;
    // 毒・猛毒は画像参照とのかなり強い一致が必要。淡い色の割合だけでは通常ドロップも誤判定される。
    const maxError = toxinType ? 30 : 48;
    return scores[0] && scores[0].error <= maxError && (!scores[1] || scores[1].error - scores[0].error >= requiredMargin) ? scores[0].type : null;
  }
  function detectBoardGrid(pixels, width, height) {
    const xProjection = new Float32Array(width);
    const yProjection = new Float32Array(height);
    for (let y = 0; y < height; y++) {
      for (let x = 0; x < width; x++) {
        const i = (y * width + x) * 4;
        const r = pixels[i], g = pixels[i+1], b = pixels[i+2];
        const maximum = Math.max(r, g, b);
        const chroma = maximum - Math.min(r, g, b);
        if (maximum > 65 && chroma > 22) {
          const weight = (maximum - 65) * chroma / 190;
          xProjection[x] += weight;
          yProjection[y] += weight;
        }
      }
    }

    function fitAxis(projection, counts) {
      const length = projection.length;
      const smooth = new Float32Array(length);
      const radius = 4;
      for (let i = 0; i < length; i++) {
        const from = Math.max(0, i - radius);
        const to = Math.min(length - 1, i + radius);
        let sum = 0;
        for (let j = from; j <= to; j++) sum += projection[j];
        smooth[i] = sum / (to - from + 1);
      }
      const peak = Math.max(...smooth);
      const average = smooth.reduce((sum, value) => sum + value, 0) / length;
      if (!peak || peak < average * 1.12) return null;

      const fits = {};
      for (const count of counts) {
        const basePitch = length / count;
        let best = {score:-1, pitch:basePitch, centers:[]};
        for (let pitch = basePitch * 0.70; pitch <= basePitch * 1.01; pitch += 0.5) {
          const firstCenter = (length - (count - 1) * pitch) / 2;
          const centers = Array.from({length:count}, (_, index) => firstCenter + index * pitch);
          const searchRadius = Math.max(2, Math.round(pitch * 0.06));
          let score = 0;
          for (const center of centers) {
            const from = Math.max(0, Math.floor(center - searchRadius));
            const to = Math.min(length - 1, Math.ceil(center + searchRadius));
            let localPeak = 0;
            for (let i = from; i <= to; i++) localPeak = Math.max(localPeak, smooth[i]);
            score += localPeak;
          }
          score = score / count / peak;
          if (score > best.score) best = {score, pitch, centers};
        }
        fits[count] = best;
      }
      return fits;
    }

    const columnFits = fitAxis(xProjection, [5, 6, 7]);
    const rowFits = fitAxis(yProjection, [4, 5, 6]);
    if (!columnFits || !rowFits) return null;
    const layouts = [
      {width:5,height:4},
      {width:6,height:5},
      {width:7,height:6}
    ];
    return layouts.map(size => ({
      ...size,
      score:(columnFits[size.width].score + rowFits[size.height].score) / 2,
      x:columnFits[size.width],
      y:rowFits[size.height]
    })).sort((a,b) => b.score - a.score)[0];
  }
  async function readBoardImage(image) {
    const canvas = document.createElement('canvas');
    canvas.width = image.naturalWidth;
    canvas.height = image.naturalHeight;
    const context = canvas.getContext('2d', {willReadFrequently:true});
    context.drawImage(image, 0, 0, canvas.width, canvas.height);
    const pixels = context.getImageData(0, 0, canvas.width, canvas.height).data;
    const references = await loadSpecialReferences();
    const requiredReferenceTypes = ['jammer', 'bomb', 'poison', 'mortalPoison'];
    if (requiredReferenceTypes.some(type => !references.some(reference => reference.type === type))) {
      say('HTMLに埋め込んだ参照画像を読み込めませんでした。index.htmlを保存し直して、ページを再読み込みしてください。', 'error');
      return;
    }
    const detectedGrid = detectBoardGrid(pixels, canvas.width, canvas.height);
    const detectedSize = detectedGrid || {width:W, height:H};
    const targetW = detectedSize.width;
    const targetH = detectedSize.height;
    const targetN = targetW * targetH;

    const detectedCounts = Object.fromEntries(order.map(type => [type, 0]));
    const result = [];
    const sampleOffsets = Array.from({length:24}, (_, i) => {
      const angle = (i / 24) * Math.PI * 2;
      return [Math.cos(angle) * .3, Math.sin(angle) * .3];
    });
    const templateCanvas = document.createElement('canvas');
    templateCanvas.width = templateCanvas.height = 24;
    const templateContext = templateCanvas.getContext('2d', {willReadFrequently:true});
    const nominalPitch = Math.min(canvas.width / targetW, canvas.height / targetH);
    const estimatedXPitch = detectedGrid?.x.pitch;
    const estimatedYPitch = detectedGrid?.y.pitch;
    let cellPitch = nominalPitch;
    if (estimatedXPitch && estimatedYPitch) {
      const relativeDifference = Math.abs(estimatedXPitch - estimatedYPitch) / nominalPitch;
      if (relativeDifference <= 0.08) {
        cellPitch = (estimatedXPitch + estimatedYPitch) / 2;
      } else {
        // 片方の色投影がキャラクターや装飾に引っ張られた場合、画像サイズに近い軸の推定を使う。
        cellPitch = Math.abs(estimatedXPitch - nominalPitch) <= Math.abs(estimatedYPitch - nominalPitch)
          ? estimatedXPitch : estimatedYPitch;
      }
    } else {
      cellPitch = estimatedXPitch || estimatedYPitch || nominalPitch;
    }
    const cellPitchX = cellPitch;
    const cellPitchY = cellPitch;
    const xStart = (canvas.width - (targetW - 1) * cellPitch) / 2;
    const yStart = (canvas.height - (targetH - 1) * cellPitch) / 2;
    const xCenters = Array.from({length:targetW}, (_, col) => xStart + col * cellPitch);
    const yCenters = Array.from({length:targetH}, (_, row) => yStart + row * cellPitch);

    for (let row = 0; row < targetH; row++) {
      for (let col = 0; col < targetW; col++) {
        const centerX = xCenters[col];
        const centerY = yCenters[row];
        const radius = Math.min(cellPitchX, cellPitchY);
        const colorSamples = [];
        for (const [ox, oy] of sampleOffsets) {
          const x = Math.max(0, Math.min(canvas.width - 1, Math.round(centerX + ox * radius)));
          const y = Math.max(0, Math.min(canvas.height - 1, Math.round(centerY + oy * radius)));
          const i = (y * canvas.width + x) * 4;
          colorSamples.push([pixels[i], pixels[i+1], pixels[i+2]]);
        }

        templateContext.clearRect(0, 0, 24, 24);
        templateContext.drawImage(canvas, centerX-cellPitchX/2, centerY-cellPitchY/2, cellPitchX, cellPitchY, 0, 0, 24, 24);
        const tilePixels = templateContext.getImageData(0, 0, 24, 24).data;
        const isMortalPoison = hasMortalPoisonColorSignature(tilePixels);
        const isPoison = hasPoisonColorSignature(tilePixels);
        const specialType = isPoison ? 'poison' : isMortalPoison ? 'mortalPoison' : findSpecialTemplate(tilePixels, references);
        const detectedType = specialType || classifyOrbColor(colorSamples);
        detectedCounts[detectedType]++;
        result.push(detectedType);
      }
    }

    saveUndo();
    stopRouletteTimer();
    clearRouteHistory();
    W = targetW;
    H = targetH;
    N = targetN;
    updateBoardLayout();
    buildGenerationOptions();
    cellElements = [];
    rouletteAnimations.forEach(animation => animation?.cancel());
    rouletteAnimations = [];
    routeOverlay = null;
    cells = result;
    roulette = Array(N).fill(false);
    moveCount = 0;
    moveCountLabel.textContent = '0';
    selected = -1;
    drag = -1;
    draw();
    say('画像を読み込みました。盤面を ' + W + ' × ' + H + '（' + N + 'マス）に自動設定しました。判定数：' + order.map(type => label[type] + ' ' + detectedCounts[type]).join('、') + '。');
  }

  function matches() {

        run = [index];
        for (let y = row + 1; y < H && cells[y * W + col] === type; y++) run.push(y * W + col);

  function compareClearOrder(a, b) {

  function getMatchGroups(matched) {
    const visited = new Set();
    const groups = [];

    for (const start of matched) {
      if (visited.has(start)) continue;
      const type = cells[start];
      const stack = [start];
      const group = [];
      visited.add(start);

      while (stack.length) {
        const index = stack.pop();
        group.push(index);
        const row = Math.floor(index / W), col = index % W;
        const neighbors = [];
        if (col > 0) neighbors.push(index - 1);
        if (col < W - 1) neighbors.push(index + 1);
        if (row > 0) neighbors.push(index - W);
        if (row < H - 1) neighbors.push(index + W);

        for (const next of neighbors) {
          if (matched.has(next) && !visited.has(next) && cells[next] === type) {
            visited.add(next);
            stack.push(next);
          }

      }

      groups.push(group.sort(compareClearOrder));

    const dy = -Math.abs(y1 - y), sy = y < y1 ? 1 : -1;
    let error = dx + dy;

    while (x !== x1 || y !== y1) {
      const twiceError = 2 * error;
      if (twiceError >= dy) { error += dy; x += sx; }
      if (twiceError <= dx) { error += dx; y += sy; }
      const next = y * W + x;
      [cells[drag], cells[next]] = [cells[next], cells[drag]];
      drag = next;
      moveCount++;
      moveCountLabel.textContent = moveCount;
      currentRoute.push(next);

  async function resolve() {
    if (resolving) return;

    let totalCleared = 0, comboCount = 0, bombCount = 0;

    try {
      while (true) {

        const matchGroups = getMatchGroups(matched);
        comboCount += matchGroups.length;
        const gone = new Set(matched);
        const bombs = [];

        cells.forEach((type, index) => {
          if (type === 'bomb' && !gone.has(index)) bombs.push(index);
        });

        for (const index of bombs) {
          const row = Math.floor(index / W), col = index % W;
          for (let x = 0; x < W; x++) gone.add(row * W + x);
          for (let y = 0; y < H; y++) gone.add(y * W + col);
        }

        if (gone.size === 0) break;

        bombCount += bombs.length;
        totalCleared += gone.size;
        const bombCleared = new Set();
        bombs.sort(compareClearOrder);

        for (const bomb of bombs) {
          const row = Math.floor(bomb / W), col = bomb % W;
          const blast = new Set();
          for (let x = 0; x < W; x++) blast.add(row * W + x);
          for (let y = 0; y < H; y++) blast.add(y * W + col);
          const blastGroup = [...blast].filter(index => !bombCleared.has(index));
          if (!blastGroup.length) continue;

          draw({clearing:new Set(blastGroup)});
          await wait(180);
          blastGroup.forEach(index => {
            cells[index] = null;
            bombCleared.add(index);
          });
        }

        for (const group of matchGroups) {
          const remainingGroup = group.filter(index => cells[index] !== null);
          if (!remainingGroup.length) continue;

          draw({clearing:new Set(remainingGroup)});
          await wait(180);
          remainingGroup.forEach(index => { cells[index] = null; });
        }

        const falls = Array(N).fill(0);
        for (let col = 0; col < W; col++) {
          const survivors = [];
          for (let row = H - 1; row >= 0; row--) {
            const index = row * W + col;
            if (cells[index]) survivors.push({type:cells[index], sourceRow:row});
          }

          let targetRow = H - 1;
          for (const item of survivors) {
            const target = targetRow * W + col;
            cells[target] = item.type;
            falls[target] = targetRow - item.sourceRow;
            targetRow--;
          }

          while (targetRow >= 0) {
            const target = targetRow * W + col;
            cells[target] = null;
            falls[target] = 0;
            targetRow--;
          }
        }

        if (!noSkyfall) refillRandomEmptyCells(falls);
        draw({falls});
        await wait(410);
      }
    } finally {
      resolving = false;
    }

    draw();
    startRouletteTimer();
    lastRoute = currentRoute.slice();
    currentRoute = [];
    showRouteButton.disabled = lastRoute.length < 2;
    replayRouteButton.disabled = lastRoute.length < 2;

    if (!totalCleared) {
      say(moveCount + '手で消えるドロップはありませんでした。');
      return;
    }

    let message = moveCount + '手で' + totalCleared + '個のドロップを消去。' + comboCount + 'コンボしました。';
    if (bombCount > 0) message += '（爆弾 ' + bombCount + ' 個が爆発）';
    say(message, 'success');
  }

  board.addEventListener('pointerdown', event => {
    if (resolving || generatingBoard) return;
    const index = cellIndex(event);
    if (index < 0) return;
    event.preventDefault();

    if (placingRoulette) {
      toggleRoulette(index);
      return;
    }

    drag = index;
    dragged = false;
    saveUndo();
    if (placing) cells[index] = placing;
    board.setPointerCapture(event.pointerId);
    draw();
    updateHeld(event);
  });

  board.addEventListener('pointermove', event => {
    if (drag < 0 || placingRoulette || resolving) return;
    const target = document.elementFromPoint(event.clientX, event.clientY)?.closest('.cell');

    if (target) {
      const index = Number(target.dataset.i);
      if (index !== drag) {
        if (placing) paintAlongPath(index);
        else moveAlongPath(index);
      }
    }

    updateHeld(event);
  });

  board.addEventListener('pointerup', event => {
    if (drag < 0) return;
    const target = document.elementFromPoint(event.clientX, event.clientY)?.closest('.cell');
    const endIndex = target ? Number(target.dataset.i) : drag;
    held.classList.remove('visible');
    drag = -1;

    if (placing) {
      cells[endIndex] = placing;
      say('盤面を編集しました。3個以上そろうと自動で消えます。');
      draw();
    } else if (dragged) {
      resolve();
    } else {
      selected = -1;
    }
  });

  document.querySelector('#shuffle').onclick = async () => {
    if (!resolving && !generatingBoard) {
      const error = getGenerationError();
      if (error) {
        say(error, 'error');
        return;
      }
      saveUndo();
      await remakeConfiguredBoard();
    }
  };

  showRouteButton.addEventListener('click', () => {
    if (showRouteButton.disabled) return;
    const visible = !routeOverlay?.classList.contains('visible');
    routeOverlay?.classList.toggle('visible', visible);
    showRouteButton.classList.toggle('active', visible);
    showRouteButton.textContent = visible ? 'ルートを隠す' : 'ルート表示';
    renderRoute();
  });

  replayRouteButton.addEventListener('click', replayRoute);

  document.querySelector('#noSkyfall').onclick = event => {
    noSkyfall = !noSkyfall;
    event.currentTarget.textContent = '落ちコンなし：' + (noSkyfall ? 'ON' : 'OFF');
    event.currentTarget.setAttribute('aria-pressed', String(noSkyfall));
    event.currentTarget.classList.toggle('active', noSkyfall);
    say(noSkyfall ? '落ちコンなしを有効にしました。消去後、新しいドロップは補充されません。' : '落ちコンなしを解除しました。消去後、新しいドロップが補充されます。');
  };

  document.querySelectorAll('[data-add]').forEach(button => {
    button.onclick = () => {
      if (resolving || generatingBoard) return;
      placing = placing === button.dataset.add ? null : button.dataset.add;
      placingRoulette = false;
      rouletteButton.classList.remove('active');

      document.querySelectorAll('[data-add]').forEach(other => {
        other.classList.toggle('primary', placing !== null && other === button);
      });

      if (!placing) say('盤面編集を終了しました。ドロップを動かせます。');
      else say(label[placing] + 'ドロップを置くマスをタップしてください。');
    };
  });

  rouletteButton.onclick = () => {
    if (resolving || generatingBoard) return;
    placing = null;
    document.querySelectorAll('[data-add]').forEach(button => button.classList.remove('primary'));
    placingRoulette = !placingRoulette;
    rouletteButton.classList.toggle('active', placingRoulette);
    say(placingRoulette ? 'ルーレットを置くドロップをタップしてください。続けて複数のマスに置けます。' : 'ルーレットの配置を終了しました。');
  };

  intervalSelect.addEventListener('change', () => {
    startRouletteTimer(true);
    say('ルーレットの変化間隔を更新しました。');
  });

  function applyBoardSizeSelection() {
    if (generatingBoard || resolving) {
      say('処理が終わってから盤面サイズを変更してください。', 'error');
      return;
    }
    const [width, height] = boardSizeSelect.value.split('x').map(Number);
    if (![5, 6, 7].includes(width) || ![4, 5, 6].includes(height)) return;
    if (width === W && height === H) {
      updateBoardLayout();
      return;
    }
    saveUndo();
    W = width;
    H = height;
    N = W * H;
    buildGenerationOptions();
    cellElements = [];
    rouletteAnimations.forEach(animation => animation?.cancel());
    rouletteAnimations = [];
    board.replaceChildren();
    routeOverlay = null;
    init();
    say('盤面サイズを ' + W + ' × ' + H + ' に変更しました。');
  }
  boardSizeSelect.addEventListener('change', applyBoardSizeSelection);

  undoButton.addEventListener('click', undo);
  document.querySelector('#saveBoard').addEventListener('click', saveCurrentBoard);
  document.querySelector('#loadBoard').addEventListener('click', loadSavedBoard);
  document.querySelector('#deleteBoard').addEventListener('click', deleteSavedBoard);

  savedBoardSelect.addEventListener('change', () => {
    const item = readSavedBoards().find(entry => entry.id === savedBoardSelect.value);
    if (item) savedBoardName.value = item.name;
  });

  buildTypeOptions();
  buildGenerationOptions();
  refreshSavedBoards();
  init();
})();
</script>
</body>
</html>
